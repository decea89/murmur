<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><title>Escultura interactiva — WebGPU</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b10;color:#e8e3d9;font-family:Arial,sans-serif}#unity-canvas{display:block;width:min(100vw,177.777778vh);height:min(100vh,56.25vw);outline:0;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}#unity-loading-bar{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#080b10;letter-spacing:.4em;font-size:24px}#track{width:220px;height:2px;background:#252b32;margin-top:28px}#unity-progress-bar-full{height:100%;width:0;background:#b6a484}#unity-warning{position:absolute;bottom:24px;left:24px;max-width:600px;padding:16px;background:#3d2020;display:none;line-height:1.5}
</style>
</head>
<body>
<canvas width="3840" height="2160" id="unity-canvas" tabindex="0" aria-label="Escultura interactiva de hierro"></canvas>
<div id="unity-loading-bar">Cargando…<div id="track"><div id="unity-progress-bar-full"></div></div></div>
<div id="unity-warning" role="alert"></div>
<script>
const canvas=document.querySelector('#unity-canvas');
const config={dataUrl:'Build/{{{ DATA_FILENAME }}}',frameworkUrl:'Build/{{{ FRAMEWORK_FILENAME }}}',codeUrl:'Build/{{{ CODE_FILENAME }}}',streamingAssetsUrl:'StreamingAssets',companyName:{{{ JSON.stringify(COMPANY_NAME) }}},productName:{{{ JSON.stringify(PRODUCT_NAME) }}},productVersion:{{{ JSON.stringify(PRODUCT_VERSION) }}},matchWebGLToCanvasSize:false,devicePixelRatio:1,showBanner:(message,type)=>{if(type==='error'){const banner=document.querySelector('#unity-warning');banner.textContent=message;banner.style.display='block';}else console.warn(message);}};
const loader=document.createElement('script');loader.src='Build/{{{ LOADER_FILENAME }}}';loader.onload=()=>createUnityInstance(canvas,config,p=>document.querySelector('#unity-progress-bar-full').style.width=(100*p)+'%').then(instance=>{window.murmurInstance=instance;document.querySelector('#unity-loading-bar').style.display='none';canvas.focus();}).catch(error=>config.showBanner(String(error),'error'));document.body.appendChild(loader);
</script>
</body>
</html>
